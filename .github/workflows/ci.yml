name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,learn]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Smoke test (end-to-end simulation script)
        run: python experiments/diagnose_loss.py --model push --scenario bifurcation --episodes 3
      - name: Rolling-swarm validation script runs
        run: python experiments/validate_rolling.py
